# Important Notes:
# Every field you add must be added to the expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=2.1.0
group=at.mueseb.carpettrapdoors
java_version=17

# Common
minecraft_version=1.20.1
mod_name=Carpet Trapdoors
mod_author=mueseb
mod_id=carpettrapdoors
license=GPL-3.0
credits=
description=Hides wooden and iron trapdoors by disguising them as carpets.
minecraft_version_range=[1.20,1.20.1]
fabric_minecraft_version_range=>=1.20 <=1.20.1
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# Fabric
fabric_version=0.92.12+1.20.1
fabric_loader_version=0.16.14

# Forge
forge_version=47.4.28
forge_loader_version_range=[47,)

# Publishing: ./gradlew publishMods only prepares the upload in <loader>/build/publishMods.
# ./gradlew publishMods -Pupload really uploads (needs CURSEFORGE_TOKEN and MODRINTH_TOKEN in ~/.gradle/gradle.properties).
release_type=release
# The main project that gets all loaders
curseforge_project_id=729542
# The old Fabric-only project, also receives the Fabric file (remove to stop uploading there)
curseforge_fabric_project_id=728929
# The Modrinth project, gets all loaders
modrinth_project_id=g5XfNygJ
# Game versions shown on CurseForge and Modrinth, comma separated
publish_minecraft_versions=1.20,1.20.1
# NeoForge 1.20.1 loads Forge mods, so the Forge file is tagged for both
forge_publish_loaders=forge,neoforge

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
