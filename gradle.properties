# Important Notes:
# Every field you add must be added to the expandProps map in build-logic/src/main/groovy/multiloader-common.gradle.

# Project
version=2.1.0
group=at.mueseb.carpettrapdoors
java_version=25

# Common
minecraft_version=26.3
mod_name=Carpet Trapdoors
mod_author=mueseb
mod_id=carpettrapdoors
license=GPL-3.0
credits=
description=Hides wooden, iron and copper trapdoors by disguising them as carpets.
minecraft_version_range=[26.3,26.4)
fabric_minecraft_version_range=~26.3
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric
fabric_version=0.165.0+26.3
fabric_loader_version=0.20.1

# Forge
forge_version=66.1.0
forge_loader_version_range=[66,)

# NeoForge
neoforge_version=26.3.0.99
neoforge_loader_version_range=[4,)

# Publishing: ./gradlew publishMods only prepares the upload in <loader>/build/publishMods.
# ./gradlew publishMods -Pupload really uploads (needs CURSEFORGE_TOKEN and MODRINTH_TOKEN in ~/.gradle/gradle.properties).
release_type=release
# The main project that gets all loaders
curseforge_project_id=729542
# The Modrinth project, gets all loaders
modrinth_project_id=g5XfNygJ
# Game versions shown on CurseForge and Modrinth, comma separated
publish_minecraft_versions=26.3

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 7: run the game from the merged Gradle output (needed for multi-project setups like this one)
net.minecraftforge.gradle.merge-source-sets=true
