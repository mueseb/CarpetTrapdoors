# Important Notes:
# Every field you add must be added to the expandProps map in buildSrc/src/main/groovy/multiloader-common.gradle.

# Project
version=2.1.0
group=at.mueseb.carpettrapdoors
java_version=21

# Common
minecraft_version=1.21.11
mod_name=Carpet Trapdoors
mod_author=mueseb
mod_id=carpettrapdoors
license=GPL-3.0
credits=
description=Hides wooden, iron and copper trapdoors by disguising them as carpets.
minecraft_version_range=[1.21.11]
fabric_minecraft_version_range=1.21.11
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.11-20251209.172050
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21.11
parchment_version=2025.12.20

# Fabric
fabric_version=0.141.6+1.21.11
fabric_loader_version=0.18.2

# Forge
forge_version=61.2.4
forge_loader_version_range=[61,)

# NeoForge
neoforge_version=21.11.48
neoforge_loader_version_range=[4,)

# Publishing: ./gradlew publishMods only prepares the upload in <loader>/build/publishMods.
# ./gradlew publishMods -Pupload really uploads (needs CURSEFORGE_TOKEN in ~/.gradle/gradle.properties).
release_type=release
# The main project that gets all loaders
curseforge_project_id=729542
# The old Fabric-only project, also receives the Fabric file (remove to stop uploading there)
curseforge_fabric_project_id=728929
# Game versions shown on CurseForge, comma separated
curseforge_minecraft_versions=1.21.11

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ForgeGradle 7: run the game from the merged Gradle output (needed for multi-project setups like this one)
net.minecraftforge.gradle.merge-source-sets=true
