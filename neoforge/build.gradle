plugins {
    id 'multiloader-loader'
    id 'multiloader-publish'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        server {
            server()
        }
        // Generates the shared resources of all loaders: ./gradlew :neoforge:runData
        data {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').absolutePath,
                    '--existing', rootProject.file('common/src/main/resources/').absolutePath
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

publishMods {
    file = jar.archiveFile
}
